<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="initial-scale=1, maximum-scale=1, shrink-to-fit=no, viewport-fit=cover" />
	<title>Ocean of Thought</title>
	<meta name="description" content="Ocean of Thought by fthr (Antti Jädertpolm), music by Machinedrum. A 2017 WebVR demo made in Vizor Patches, restored from backup." />

	<meta property="og:type" content="website" />
	<meta property="og:url" content="https://oceanofthought.com/" />
	<meta property="og:title" content="Ocean of Thought" />
	<meta property="og:description" content="Ocean of Thought by fthr (Antti Jädertpolm), music by Machinedrum. A 2017 WebVR demo made in Vizor Patches, restored from backup." />
	<meta property="og:image" content="https://oceanofthought.com/og.jpg" />
	<meta property="og:image:width" content="1200" />
	<meta property="og:image:height" content="630" />
	<meta property="og:image:alt" content="The Ocean of Thought title screen: the title floating over a dark planet and sea" />
	<meta name="twitter:card" content="summary_large_image" />

	<!-- opened from the home screen it runs without the browser's bars;
	     iPhone Safari has no fullscreen API for anything but video -->
	<link rel="manifest" href="manifest.webmanifest" />
	<link rel="icon" href="icon-192.png" />
	<link rel="apple-touch-icon" href="apple-touch-icon.png" />
	<meta name="apple-mobile-web-app-capable" content="yes" />
	<meta name="mobile-web-app-capable" content="yes" />
	<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
	<meta name="apple-mobile-web-app-title" content="Ocean" />
	<meta name="theme-color" content="#000000" />
	<style>
		html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
		#webgl-canvas { display: block; width: 100%; height: 100%; }
		#veil {
			position: fixed; inset: 0; display: flex; flex-direction: column;
			align-items: center; justify-content: center; gap: 10px;
			color: #cfe; font: 300 15px/1.4 system-ui, sans-serif;
			background: rgba(0,0,0,.88); cursor: pointer; text-align: center;
		}
		#veil h1 { font-weight: 200; letter-spacing: .12em; margin: 0; font-size: 34px; color: #fff; }
		#veil .progress { opacity: .7; }
		#veil .hint { position: absolute; bottom: calc(44px + env(safe-area-inset-bottom)); font-size: 12px; opacity: .45; }
		#veil.hidden { display: none; }
		#variant {
			position: fixed; right: calc(10px + env(safe-area-inset-right)); bottom: calc(8px + env(safe-area-inset-bottom));
			font: 11px system-ui, sans-serif; color: #567;
		}
		#variant a { color: #789; }
	</style>

	<script>
		// stubs for bits of the vizor.io site that the player touches
		var E2 = { track: function() {} }
		var VizorUI = {
			isMobile: {
				Android: function() { return /Android/i.test(navigator.userAgent) },
				iOS: function() { return /iPhone|iPad|iPod/i.test(navigator.userAgent) },
				any: function() { return VizorUI.isMobile.Android() || VizorUI.isMobile.iOS() }
			},
			checkCompatibleBrowser: function() { return true }
		}

		var variant = /[?&]v=jan31\b/.test(location.search) ? 'jan31' : 'final'

		var Vizor = {
			origin: location.origin,
			isEditor: false,
			autoplay: true,
			noHeader: true,
			hasAudio: true,
			hasVideo: false,
			cdnRoot: 'data',
			graphName: 'ocean-of-thought',
			hideWebVRButton: true,
			isEmbedded: false,
			startMode: 1
		}
	</script>

	<!-- same order as vizor.io's views/layouts/player.handlebars -->
	<script src="vendor/jquery-2.1.0.min.js"></script>
	<script>
		// The model loader asks the vizor.io server `GET /stat/<asset>` whether an .obj
		// has a sibling .mtl; the server answered 200 with {error} when it didn't.
		// Answer it from the static data/ tree instead.
		(function() {
			var get = $.get
			$.get = function(url, cb) {
				if (typeof url !== 'string' || url.indexOf('/stat/') !== 0)
					return get.apply(this, arguments)

				return $.ajax({ url: Vizor.cdnRoot + url.slice('/stat'.length), type: 'HEAD' })
					.then(function() { cb && cb({}) },
						function(xhr) { cb && cb({ error: xhr.status }) })
			}
		})()
	</script>
	<script src="scripts/event-emitter.js"></script>
	<script src="scripts/util.js"></script>
	<script src="scripts/hardware.js"></script>
	<script src="vendor/webvr-polyfill.js"></script>
	<script src="vendor/webvr-manager.js"></script>
	<script src="scripts/webVRAdapter.js"></script>
	<script src="js/player.js"></script>
</head>
<body>
	<canvas id="webgl-canvas" oncontextmenu="return false;"></canvas>

	<div id="veil">
		<h1>OCEAN OF THOUGHT</h1>
		<div>fthr &middot; music by Machinedrum</div>
		<div class="progress">loading&hellip;</div>
		<div class="hint"></div>
	</div>
	<div id="variant"></div>

	<script>
		$('#webgl-canvas').attr('data-graph-url', 'graph/' + variant + '.json')

		if (VizorUI.isMobile.iOS() && !navigator.standalone)
			$('#veil .hint').text('For fullscreen: Share › Add to Home Screen')

		$('#variant').html(variant === 'final'
			? 'final (Mar 2017) &middot; <a href="?v=jan31">Jan 31 version</a>'
			: 'Jan 31 2017 version &middot; <a href="?">final</a>')

		// Phones look around by moving the phone ("magic window"). The 2016 polyfill
		// fuses raw devicemotion samples for that, which iOS only sends once the page
		// asks permission from a tap; with no samples its filter sits at identity,
		// which on iOS points the camera straight up at an empty sky. Drive the
		// polyfill's pose from deviceorientation instead, as three.js'
		// DeviceOrientationControls does, and stay level until there's data.
		var installMagicWindow = (function() {
			var deg = Math.PI / 180
			var euler = new THREE.Euler()
			var backOfPhone = new THREE.Quaternion(-Math.SQRT1_2, 0, 0, Math.SQRT1_2)
			var screenQ = new THREE.Quaternion(), heading = new THREE.Quaternion()
			var device = new THREE.Quaternion(), pan = new THREE.Quaternion()
			var zee = new THREE.Vector3(0, 0, 1), up = new THREE.Vector3(0, 1, 0)
			var forward = new THREE.Vector3()
			var last = null, aligned = false

			// the polyfill's touch panner turns about its own filter axis, which
			// points the other way on iOS (and it flips the drag to match)
			var panSign = VizorUI.isMobile.iOS() ? -1 : 1

			window.addEventListener('deviceorientation', function(e) {
				if (e.alpha !== null)
					last = e
			})

			function orientation(sensor) {
				device.set(0, 0, 0, 1)

				if (last) {
					euler.set(last.beta * deg, last.alpha * deg, -last.gamma * deg, 'YXZ')
					device.setFromEuler(euler).multiply(backOfPhone)
					device.multiply(screenQ.setFromAxisAngle(zee, -(window.orientation || 0) * deg))

					if (!aligned) {
						// start out facing the scene, whichever way the phone points
						forward.set(0, 0, -1).applyQuaternion(device)
						heading.setFromAxisAngle(up, -Math.atan2(-forward.x, -forward.z))
						aligned = true
					}
				}

				var q = pan.setFromAxisAngle(up, panSign * sensor.touchPanner.theta)
					.multiply(heading).multiply(device)

				var out = sensor.orientationOut_
				out[0] = q.x; out[1] = q.y; out[2] = q.z; out[3] = q.w
				return out
			}

			return function() {
				var displays = (window._webVRPolyfill && _webVRPolyfill.displays) || []
				displays.forEach(function(display) {
					var sensor = display.poseSensor_
					if (!sensor || !sensor.touchPanner || sensor.magicWindow)
						return

					sensor.magicWindow = true
					sensor.getOrientation = function() { return orientation(sensor) }
				})
			}
		})()

		// browsers now start an AudioContext suspended until a user gesture, which
		// didn't exist in 2017. The veil gives us that gesture before the demo's own
		// in-world start screen, and on iOS the one that may ask for motion access.
		// A tap while loading counts, but the veil stays up until there's a scene.
		var loaded = false, entered = false

		function reveal() {
			if (loaded && entered)
				$('#veil').addClass('hidden')
		}

		$(window).on('vizorLoaded', function() {
			var tap = 'ontouchstart' in window ? 'tap' : 'click'

			installMagicWindow()
			E2.core.webVRAdapter.on('ready', installMagicWindow)

			// the soundtrack plugin swaps .ogg for .m4a on Safari, but only after the
			// preloader has fetched the .ogg, which Safari can't decode
			var assetLoader = E2.core.assetLoader, loadAsset = assetLoader.loadAsset
			assetLoader.loadAsset = function(type, url) {
				if (type === 'audiobuffer' && (E2.util.isMobile.iOS() || E2.util.isBrowser.Safari()))
					url = url.replace(/\.ogg$/, '.m4a')
				return loadAsset.call(this, type, url)
			}

			E2.core.on('progress', function(pct) {
				// assets loaded after the preload report progress again
				if (!loaded)
					$('#veil .progress').text('loading ' + Math.round(pct) + '%')
			})
			E2.core.on('assetsLoaded', function() {
				loaded = true
				installMagicWindow()
				$('#veil .progress').text(tap + ' to enter')
				reveal()
			})
		})

		$('#veil').on('click', function() {
			// iOS reports 'interrupted' as well as 'suspended'
			var ctx = E2.core && E2.core.audioContext
			if (ctx && ctx.state !== 'running')
				ctx.resume()

			// play the soundtrack like a video would, even with the ringer off
			if (navigator.audioSession)
				navigator.audioSession.type = 'playback'

			if (window.DeviceOrientationEvent && DeviceOrientationEvent.requestPermission)
				DeviceOrientationEvent.requestPermission().catch(function() {})

			entered = true
			reveal()
		})
	</script>
</body>
</html>
